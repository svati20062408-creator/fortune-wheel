<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Колесо фортуны</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#777);--btn:var(--tg-theme-button-color,#2f7cf6);--btx:var(--tg-theme-button-text-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#f1f1f4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:460px;margin:0 auto}
.stage{position:relative;width:min(88vw,380px);aspect-ratio:1;margin:14px auto 8px}
canvas{width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.ptr{position:absolute;left:50%;top:-10px;transform:translateX(-50%);border:13px solid transparent;border-top:28px solid var(--tx);border-bottom:0;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--sec);color:var(--tx);cursor:pointer}
button.main{background:var(--btn);color:var(--btx);width:100%;font-weight:600;padding:14px}
button:disabled{opacity:.5}
.res{min-height:60px;display:grid;place-items:center;text-align:center;font-size:26px;font-weight:700;word-break:break-word}
.row{display:flex;gap:8px;margin:12px 0}
.row input{flex:1;min-width:0;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--sec);background:var(--sec);color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--sec);border-radius:999px;padding:5px 10px;font-size:14px}
.chip i{width:10px;height:10px;border-radius:50%}
.chip b{cursor:pointer;color:var(--hint);font-size:16px;line-height:1}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 8px}
.tools button{font-size:14px;padding:8px 11px}
label{display:flex;align-items:center;gap:8px;font-size:15px;margin:8px 0}
.hist{color:var(--hint);font-size:14px;margin-top:10px}
#send{width:100%;margin-top:8px}
</style></head>
<body><div class="wrap">
<div class="stage"><i class="ptr"></i><canvas id="wheel"></canvas></div>
<div class="res" id="res"></div>
<button class="main" id="spin">Крутить</button>
<div class="row"><input id="inp" placeholder="Слово, число, диапазон 1-20 или список через запятую" enterkeyhint="done"><button id="add">Добавить</button></div>
<div class="chips" id="chips"></div>
<div class="tools">
<button data-p="yn">Да / Нет</button><button data-p="ht">Орёл / Решка</button><button data-p="n10">Числа 1–10</button><button data-p="d6">Кубик</button>
<button id="shuf">Перемешать</button><button id="clr">Очистить</button>
</div>
<label><input type="checkbox" id="elim"> Выбывание: убирать выпавший вариант</label>
<label><input type="checkbox" id="snd" checked> Звук</label>
<button id="send" hidden>Отправить результат в чат</button>
<div class="hist" id="hist"></div>
</div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();}
const $=id=>document.getElementById(id);
const COLORS=['#C8553D','#2E86AB','#3B8F5C','#8E5BB5','#D98A1F','#CC4F7A','#3D5A80','#6A994E'];
const TAU=Math.PI*2;
const cv=$('wheel'),ctx=cv.getContext('2d');
let items=[],angle=0,spinning=false,history=[],lastWinner=null,ac=null;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const PRESETS={yn:['Да','Нет'],ht:['Орёл','Решка'],n10:Array.from({length:10},(_,i)=>String(i+1)),d6:['1','2','3','4','5','6']};

function parse(text){
  const m=text.trim().match(/^(-?\d+)\s*(?:-|–|—|\.\.)\s*(\d+)$/);
  if(m){let a=+m[1],b=+m[2];if(a>b)[a,b]=[b,a];b=Math.min(b,a+59);return Array.from({length:b-a+1},(_,i)=>String(a+i));}
  return text.split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean);
}
function colorOf(i){const n=items.length;return (i===n-1&&n>1&&i%COLORS.length===0)?COLORS[3]:COLORS[i%COLORS.length];}
function pick(){const n=items.length,rel=((-Math.PI/2-angle)%TAU+TAU)%TAU;return Math.floor(rel/(TAU/n))%n;}
const css=v=>getComputedStyle(document.body).getPropertyValue(v).trim();

function draw(){
  const dpr=window.devicePixelRatio||1,s=cv.clientWidth;
  if(!s)return;
  if(cv.width!==Math.round(s*dpr)){cv.width=cv.height=Math.round(s*dpr);}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,s,s);
  const c=s/2,r=c-4,n=items.length;
  if(!n){
    ctx.beginPath();ctx.arc(c,c,r,0,TAU);ctx.fillStyle=css('--sec')||'#eee';ctx.fill();
    ctx.fillStyle=css('--hint')||'#777';ctx.font='600 17px system-ui';ctx.textAlign='center';ctx.fillText('Добавьте варианты',c,c+6);return;
  }
  const arc=TAU/n,fs=Math.max(11,Math.min(22,s/(n*0.55+6)*1.6));
  for(let i=0;i<n;i++){
    const a0=angle+i*arc;
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a0,a0+arc);ctx.closePath();
    ctx.fillStyle=colorOf(i);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.save();ctx.translate(c,c);ctx.rotate(a0+arc/2);
    ctx.fillStyle='#fff';ctx.font='600 '+fs+'px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=3;
    let t=items[i];if(t.length>16)t=t.slice(0,15)+'…';
    ctx.fillText(t,r-14,0);ctx.restore();
  }
  ctx.beginPath();ctx.arc(c,c,r*0.1,0,TAU);ctx.fillStyle=css('--bg')||'#fff';ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=css('--tx')||'#111';ctx.stroke();
}

function render(){
  const ch=$('chips');ch.textContent='';
  items.forEach((t,i)=>{
    const d=document.createElement('span');d.className='chip';
    const dot=document.createElement('i');dot.style.background=colorOf(i);
    const s=document.createElement('span');s.textContent=t;
    const x=document.createElement('b');x.textContent='×';
    x.onclick=()=>{if(!spinning){items.splice(i,1);changed();}};
    d.append(dot,s,x);ch.append(d);
  });
  $('spin').disabled=spinning||items.length<2;
  $('hist').textContent=history.length?'Последние результаты: '+history.slice(0,8).join(', '):'';
  draw();
}
function changed(){store.set('items',items);render();}
function setItems(l){if(spinning)return;items=l.slice(0,60);$('res').textContent='';changed();}

function beep(){
  if(!$('snd').checked)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.04;
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.03);}catch(e){}
}
function tick(){beep();try{tg&&tg.HapticFeedback.selectionChanged();}catch(e){}}

function spin(){
  if(spinning||items.length<2)return;
  spinning=true;$('res').textContent='';$('send').hidden=true;render();
  const start=angle,total=TAU*(5+Math.random()*3)+Math.random()*TAU,dur=4200+Math.random()*1800,t0=performance.now();
  let last=pick();
  (function f(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);
    angle=start+total*e;draw();
    const i=pick();if(i!==last){last=i;tick();}
    if(p<1)requestAnimationFrame(f);else done();
  })(t0);
}
function done(){
  spinning=false;angle%=TAU;
  const w=items[pick()];lastWinner=w;
  $('res').textContent='🎉 '+w;
  history.unshift(w);history=history.slice(0,10);store.set('hist',history);
  try{tg&&tg.HapticFeedback.notificationOccurred('success');}catch(e){}
  $('send').hidden=!tg;
  if($('elim').checked){setTimeout(()=>{if(spinning)return;const i=items.indexOf(w);if(i>-1){items.splice(i,1);changed();}},1200);}
  render();
}

$('spin').onclick=spin;cv.onclick=spin;
$('add').onclick=()=>{if(spinning)return;const l=parse($('inp').value);if(l.length){items=items.concat(l).slice(0,60);$('inp').value='';changed();}};
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click();});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>setItems(PRESETS[b.dataset.p]));
$('shuf').onclick=()=>{if(spinning)return;for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}changed();};
$('clr').onclick=()=>setItems([]);
$('send').onclick=()=>{try{tg.sendData(JSON.stringify({winner:lastWinner,items}));}catch(e){}};
window.addEventListener('resize',draw);

// старт: список из ссылки бота (?items=[...]) или сохранённый
try{const q=new URLSearchParams(location.search).get('items');if(q){const a=JSON.parse(q);if(Array.isArray(a))items=a.map(String).slice(0,60);}}catch(e){}
if(!items.length)items=store.get('items')||[];
history=store.get('hist')||[];
render();
</script></body></html>
